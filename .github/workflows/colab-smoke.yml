name: Colab compatibility smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile Python files
        run: python -m compileall -q app.py config.py pipeline
      - name: Check browser JavaScript syntax
        run: node --check static/js/app.js
